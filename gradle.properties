# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod Properties — sürümden bağımsız
mod_version=8.4.1
maven_group=com.photonpulse
archives_base_name=candy

# Sürüme bağlı anahtarlar (minecraft_version, yarn_mappings, loader_version,
# fabric_version, minecraft_dep) versions/<sürüm>/gradle.properties içinde.

# NeoForge düğümleri (versions/*-neoforge). Varsayılan KAPALI: port bitmedi, o
# düğümler derlenmiyor ve açık bırakılırsa kökteki `./gradlew build` kırmızı olur.
# Üzerinde çalışmak için: ./gradlew -Pcandy.neoforge=true :1.21.7-neoforge:compileJava
candy.neoforge=false
