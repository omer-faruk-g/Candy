# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod Properties — sürümden bağımsız
mod_version=9.0.0
maven_group=com.photonpulse
archives_base_name=candy

# Sürüme bağlı anahtarlar (minecraft_version, yarn_mappings, loader_version,
# fabric_version, minecraft_dep) versions/<sürüm>/gradle.properties içinde.

# NeoForge düğümleri (versions/*-neoforge). Varsayılan AÇIK: iki MC sürümünde de
# jar üretiyor ve istemci ana menüye kadar açıldı (11/11 mixin, 0 hata).
# Kapatmak için: ./gradlew -Pcandy.neoforge=false ...
candy.neoforge=true
