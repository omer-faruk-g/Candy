name: Build Candy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # elle tetikleme butonu
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # release'e JAR yüklemek için

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # 25, 21 degil: fabric-loom 1.19.3 JVM 25 bayt kodu (class major 69), JDK 21'de
          # Gradle daemon'ina yuklenemiyor. Uretilen jar'lar hala release 21 (26.x: 25).
          java-version: '25'

      - name: Gradle wrapper cache
        uses: gradle/actions/setup-gradle@v3

      - name: gradlew executable yap
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      # Stonecutter her dugumun jar'ini versions/<dugum>/build/libs altina koyuyor.
      # tumunuTopla hepsini kok build/libs'e kopyalar — asagidaki iki adim orayi okuyor.
      - name: JAR'lari tek yerde topla
        run: ./gradlew tumunuTopla --stacktrace

      - name: JAR'ı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: candy-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Release'e JAR ekle
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
