pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }
    plugins {
        // Tek loom tüm düğümleri çeviriyor; düğüm başına ayrı loom sürümü mümkün değil
        // (settings bir kez değerlendirilir), o yüzden en yeni stabil sürüm.
        id 'fabric-loom' version '1.17.2'
        // ModDevGradle — NeoForge düğümleri için. Java 17 bytecode, JDK 21'de çalışır.
        id 'net.neoforged.moddev' version '2.0.148'
    }
}

plugins {
    id("dev.kikugie.stonecutter").version "0.9.8"
}

rootProject.name = 'candy'

stonecutter {
    // Proje Groovy; Stonecutter varsayılanı Kotlin.
    kotlinController = false
    centralScript = "build.gradle"

    // DAL (branch) YOK, yalnızca DÜĞÜM (node): dal başına ayrı src/ ağacı üretilir,
    // yani 206 dosya loader başına kopyalanırdı. Dört düğümün hepsi TEK src/ ağacını
    // paylaşıyor. Gerekçe: MULTILOADER.md.
    //
    // vers(<düğüm adı>, <MC sürümü>) — düğüm dizini adı ile Stonecutter'ın sürüm
    // karşılaştırmasında kullandığı sürüm ayrı. Böylece `current.parsed >= '1.21.9'`
    // kuralları NeoForge düğümlerinde de aynı çalışıyor.
    //
    // 26.x henüz yok, ama ARTIK ENGEL DEĞİL: kaynak Mojang resmî adlarına göçtü,
    // düğüm eklemek sıradan sürüm işi (bkz. MULTILOADER.md "Mapping göçü").
    create(rootProject) {
        versions("1.21.7", "1.21.11")
        vers("1.21.7-neoforge", "1.21.7")
        vers("1.21.11-neoforge", "1.21.11")
    }
}
