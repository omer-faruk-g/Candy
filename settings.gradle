pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }
    plugins {
        // Tek loom tüm düğümleri çeviriyor; düğüm başına ayrı loom sürümü mümkün değil
        // (settings bir kez değerlendirilir), o yüzden en yeni stabil sürüm.
        //
        // 1.17.2 -> 1.19.3: 26.x hattı için ZORUNLU. Loom 1.17.x MC 26.x'i yapılandırma
        // aşamasında reddediyor ("Minecraft 26.3 requires Java 25 but Gradle is using 21")
        // ve 26.x hiç mapping yayınlamıyor (jar zaten deobfuscated), bunu yalnızca
        // loom 1.18+ biliyor. Bedeli: loom 1.18+ JVM 25 bayt kodu (class major 69), yani
        // ARTIK BÜTÜN PROJE JDK 25 İLE DERLENİYOR — 1.21.x düğümleri dahil.
        // Üretilen jar'lar hâlâ release 21 bayt kodu (26.x düğümü release 25).
        id 'fabric-loom' version '1.19.3'
        // AYNI artifact, FARKLI plugin id. Loom 1.19.3 iki yol sunuyor ve secimi plugin
        // id yapiyor (loom jar'indaki META-INF/gradle-plugins'ten dogrulandi):
        //   fabric-loom              -> LoomGradlePlugin       (obfuscated/remap, 1.21.x)
        //   net.fabricmc.fabric-loom -> LoomNoRemapGradlePlugin (no-remap, 26.x)
        // CompileConfiguration bytecode'u: disableObfuscation() true ise `mappings`
        // yapilandirmasi HIC OKUNMUYOR, NoRemapMappingConfiguration kullaniliyor; ve
        // disableObfuscation, hasPlugin("net.fabricmc.fabric-loom") ise true'ya set ediliyor.
        // 26.x bunu gerektiriyor cunku ne client_mappings ne de intermediary yayinlaniyor
        // (intermediary de Yarn gibi 1.21.11'de duruyor) — jar zaten deobfuscated.
        id 'net.fabricmc.fabric-loom' version '1.19.3'
        // ModDevGradle — NeoForge düğümleri için. Java 17 bytecode, JDK 21'de çalışır.
        id 'net.neoforged.moddev' version '2.0.148'
    }
}

plugins {
    id("dev.kikugie.stonecutter").version "0.9.8"
}

rootProject.name = 'candy'

def neoforgeAcik = providers.gradleProperty('candy.neoforge').getOrElse('false').toBoolean()

stonecutter {
    // Proje Groovy; Stonecutter varsayılanı Kotlin.
    kotlinController = false
    centralScript = "build.gradle"

    // DAL (branch) YOK, yalnızca DÜĞÜM (node): dal başına ayrı src/ ağacı üretilir,
    // yani 206 dosya loader başına kopyalanırdı. Dört düğümün hepsi TEK src/ ağacını
    // paylaşıyor. Gerekçe: MULTILOADER.md.
    //
    // vers(<düğüm adı>, <MC sürümü>) — düğüm dizini adı ile Stonecutter'ın sürüm
    // karşılaştırmasında kullandığı sürüm ayrı. Böylece `current.parsed >= '1.21.9'`
    // kuralları NeoForge düğümlerinde de aynı çalışıyor.
    //
    // 26.x henüz yok, ama ARTIK ENGEL DEĞİL: kaynak Mojang resmî adlarına göçtü,
    // düğüm eklemek sıradan sürüm işi (bkz. MULTILOADER.md "Mapping göçü").
    //
    // NeoForge düğümleri ANAHTARIN ARKASINDA, varsayılan KAPALI.
    // Neden: `./gradlew build` kök projede koşunca BÜTÜN düğümleri derler. NeoForge
    // düğümleri henüz derlenmiyor (src/main/java'daki 101 dosya hâlâ net.fabricmc.*
    // import ediyor), yani açık bırakılsa kökteki build ve CI kırmızı olurdu —
    // "her commit'te Fabric yeşil" kuralı bunu yasaklıyor.
    // Açmak için:  ./gradlew -Pcandy.neoforge=true :1.21.7-neoforge:compileJava
    // Port bitip jar üretmeye başladığında gradle.properties'te varsayılanı true yap.
    create(rootProject) {
        versions("1.21.7", "1.21.11", "26.1", "26.2", "26.3")
        if (neoforgeAcik) {
            vers("1.21.7-neoforge", "1.21.7")
            vers("1.21.11-neoforge", "1.21.11")
        }
    }
}
