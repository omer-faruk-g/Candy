// Stonecutter MERKEZ BETİĞİ — her düğüm (versions/<sürüm>) için bir kez çalışır.
// Sürüme bağlı değerler versions/<sürüm>/gradle.properties'ten gelir.
// LOADER SECIMI: tek merkez betik iki loader'i da cevirir. Eklenti kosullu uygulanir
// cunku plugins{} blogu kosul kabul etmez — "apply false" ile classpath'e alinir,
// sonra dugumun loader'ina gore apply edilir.
// Neden tek betik: stonecutter replacements listesi TEK yerde kalmak zorunda. Iki kopya
// olsaydi aralarindaki herhangi bir fark, aktif dugum degistiginde paylasilan src/
// agacini yarim cevrilmis halde birakirdi (bkz. asagidaki UYARI).
plugins {
    id 'java'
    id 'fabric-loom' apply false
    id 'net.neoforged.moddev' apply false
}

def mc = stonecutter.current.version
def loader = (findProperty('loader') ?: 'fabric').toString()

// JAVA SURUMU SURUME BAGLI. 26.x hattinin tamami JVM 25 istiyor: Minecraft'in KENDI
// class dosyalari major 69 (Java 25) ve javac 21 onlari okuyamiyor bile
// ("class file has wrong version 69.0, should be 65.0"). 1.21.x 21'de kaliyor, yani
// dagitilan 1.21.x jar'larinin calisma zamani gereksinimi DEGISMIYOR.
def javaSurum = stonecutter.current.parsed >= '26' ? 25 : 21

version = "${property('mod_version')}+${mc}"
group = property('maven_group')
base { archivesName = property('archives_base_name') }

// LOADER'A OZEL KAYNAK AGACI. Paylasilan src/main/java (206 dosya) TEK; bunun yaninda
// her loader kendi platform katmanini kendi agacinda tutuyor. Ayni paket + ayni sinif
// adlari, farkli govdeler — cagri yerleri iki tarafta da ayni kodu yaziyor.
// Stonecutter DALI DEGIL: 206 dosya kopyalanmiyor, yalnizca ince katman ikiye ayriliyor.
// Bu agaclarda //? direktifi ve replacement YOK; iki MC surumunde de ayni derlenen
// sembolleri kullanmak zorundalar.
sourceSets.main.java.srcDir rootProject.file("src/${loader}/java")

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.neoforged.net/releases' }
}

if (loader == 'fabric') {
    apply plugin: 'fabric-loom'

    dependencies {
        minecraft "com.mojang:minecraft:${property('minecraft_version')}"
        // Mojang resmî adları — TÜM düğümlerde. Yarn eşlemeleri 1.21.11'de durduğu için
        // Yarn'da kalmak 26.x hattını kalıcı olarak kapatıyordu; kaynak Mojang adlarına
        // göçtü (bkz. MULTILOADER.md "Mapping göçü"). Yarn artık hiçbir düğümde kullanılmıyor,
        // ama versions/<sürüm>/gradle.properties içindeki yarn_mappings anahtarı
        // doğrulama/karşılaştırma için korundu.
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${property('loader_version')}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${property('fabric_version')}"
        // Gson zaten Minecraft ile geliyor, ayrıca eklemiyoruz
    }

    // Test profili: ./gradlew runTest
    // runClient GERCEK davranisi korur (45 sn cooldown, komut kilidi acik, dev komutu yok).
    // runTest ise kapiyi acar: /candy komutu + kisa cooldown + vanilla cheat komutlari.
    // Yalnizca dev run'i etkiler; jar'a hicbir sey sizmaz.
    loom {
        runs {
            test {
                client()
                name = "Candy Test Client"
                vmArg "-Dcandy.debug=true"   // /candy komutu + kisa cooldown
                vmArg "-Dcandy.nolock=true"  // /gamemode /tp /time gibi vanilla komutlar
            }
        }
    }
} else {
    // NeoForge: ModDevGradle. Minecraft'i Mojang resmi adlariyla veriyor — kaynak
    // zaten o adlari tasiyor, remap yok. (Gocten once bu yol kapali idi.)
    apply plugin: 'net.neoforged.moddev'

    // Port suresince TAM hata listesi lazim; javac varsayilan 100'de kesiyor ve
    // kesilmis sayi "ilerleme yok" gibi gorunuyor. Port bitince kaldirilabilir.
    tasks.withType(JavaCompile).configureEach {
        it.options.compilerArgs << '-Xmaxerrs' << '2000'
    }

    neoForge {
        version = property('neoforge_version')
        // Mixin yapilandirmasi neoforge.mods.toml icindeki [[mixins]] ile bildiriliyor;
        // candy.mixins.json oldugu gibi yeniden kullaniliyor.
        validateAccessTransformers = true
        runs {
            client { client() }
            // Test profili Fabric tarafiyla ayni bayraklari tasir.
            testClient {
                client()
                systemProperty 'candy.debug', 'true'
                systemProperty 'candy.nolock', 'true'
            }
        }
        mods {
            candy {
                sourceSet sourceSets.main
            }
        }
    }
}

// Kapanis icinde property() task'a delege olur, projeye degil — disarida yakala.
def modSurum = version
def mcDep = property('minecraft_dep')
// fabric.mod.json'daki "java" kisiti da surume bagli: 26.x jar'i JVM 25 istiyor.
// Sabit ">=21" birakilsa 26.x jar'i Java 21'de yuklenmeyi kabul eder ve oyun
// ic cagrida patlardi.
def javaDep = ">=${javaSurum}".toString()
processResources {
    inputs.property "version", modSurum
    inputs.property "minecraft_dep", mcDep
    inputs.property "java_dep", javaDep
    // Iki loader'in metadata dosyasi da ayni degerleri bekliyor.
    filesMatching(["fabric.mod.json", "META-INF/neoforge.mods.toml"]) {
        expand "version": modSurum, "minecraft_dep": mcDep, "java_dep": javaDep
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaSurum
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(javaSurum)
    targetCompatibility = JavaVersion.toVersion(javaSurum)
}

jar {
    from("LICENSE") { rename { "${it}_${base.archivesName.get()}" } }
}

// Her düğümün jar'ı kök build/libs altında toplanır — dağıtımı tek yerden yapmak için.
// Fabric'te dagitilan jar remapJar'in cikti; NeoForge'da remap yok, jar dogrudan.
def dagitimJar = loader == 'fabric' ? tasks.named('remapJar') : tasks.named('jar')
tasks.register('tumunuTopla', Copy) {
    dependsOn dagitimJar
    from dagitimJar
    into rootProject.layout.buildDirectory.dir('libs')
}

// Dogrulama yardimcisi: derlenmis siniflari headless kosturmak icin classpath yaz.
tasks.register('yazCp') {
    doLast {
        def f = layout.buildDirectory.file('cp.txt').get().asFile
        f.parentFile.mkdirs()
        f.text = sourceSets.main.runtimeClasspath.asPath
        println "cp -> ${f}"
    }
}

// Surumler arasi mapping yeniden adlandirmalari.
// UYARI: Stonecutter bu degisimleri PAYLASILAN src/ agacina YERINDE uygular. Aktif surum
// degistiginde src/ o surumun adlarina donusur. Bu yuzden bir kural eklendikten sonra
// SILINMEMELI: silinen kuralin tersi calismaz ve src/ yarim cevrilmis halde kalir.
// Adlar javap ile 1.21.7 ve 1.21.11 yarn jar'larindan dogrulandi.
//
// KURAL SECIMI: duz metin degisimi alici tipini bilmez. Ad iki tarafta da gecerliyse
// (Chunk.getPos ile Entity.getPos gibi) ciplak desen yanlis siniflari da vurur.
// Yonu ters cevirmek cozum DEGIL: aktif dugum src/'yi yerinde derler, replacement
// orada hic kosmaz — yani src/ her zaman AKTIF surumun adlarini tasimak zorunda.
// Dolayisiyla belirsiz adlar aliciya capalanir ("player.getPos()"), ciplak birakilmaz.
// Yeni bir entity degiskeni eklenirse buraya kurali da eklemek gerekir; eksikse
// 1.21.11 derlemesi o satirda yuksek sesle patlar, sessiz kalmaz.
// Kurallar Mojang adlarina gore yeniden yazildi. Yarn'daki iki kural BURADA YOK ve
// olmamasi dogru: Entity.getWorld/getPos ikilisi Yarn'da 1.21.9'da yeniden adlandirilmisti,
// Mojang ise iki surumde de level()/position() diyor — yani o iki kural Yarn'in kendi
// yeniden adlandirmasiydi, Minecraft'in degil. Mojang tarafi onlari ucuruyor.
//
// Karsiliginda Mojang'in Yarn'in sakladigi yeniden adlandirmalari var: ResourceLocation
// -> Identifier (70 kullanim) ve PlayerRenderState -> AvatarRenderState. Yarn iki surumde
// de Identifier/PlayerEntityRenderState dedigi icin bunlar eski kural listesinde yoktu.
//
// Liste tahminle degil, OLCUMLE cikarildi: iki dugumun Mercury ile gocurulmus agaclari
// (migrateMappings, 1.21.7 ve 1.21.11) birebir karsilastirildi; asagidakiler iki agac
// arasinda farklilasan butun sembollerdir.
stonecutter {
    // Loader sabitleri: kaynakta `//? if fabric {` / `//? if neoforge {` kullanilabilir.
    // Dal (branch) DEGIL — paylasilan src/ agaci tek, yalnizca satirlar aciliyor/kapaniyor.
    constants.match(loader, 'fabric', 'neoforge')

    replacements.string(current.parsed >= '1.21.9') {
        // Sinif yeniden adlandirmalari. Candy'de ayni adi tasiyan kendi sinifi yok,
        // mixin method= dizgilerinde de gecmiyorlar (dogrulandi), o yuzden ciplak.
        replace 'ResourceLocation', 'Identifier'
        replace 'PlayerRenderState', 'AvatarRenderState'
        // ResourceKey.location() -> identifier(). 'location' cok yaygin bir ad, bu yuzden
        // ciplak DEGIL; uc gercek alicinin hepsi capalandi.
        replace '.dimension().location()', '.dimension().identifier()'
        replace 'key.location()', 'key.identifier()'
        replace 'worldKey.location()', 'worldKey.identifier()'
        // authlib 7: GameProfile record oldu. getGameProfile() ile capalandi ki ayni adi
        // tasiyan baska siniflar (Entity.getName gibi) etkilenmesin.
        replace '.getGameProfile().getName()', '.getGameProfile().name()'
        replace '.getGameProfile().getProperties()', '.getGameProfile().properties()'
        // Paket tasimalari. Hepsi tam nitelikli, her biri src/ icinde tek kullanim.
        replace 'net.minecraft.client.model.PlayerModel', 'net.minecraft.client.model.player.PlayerModel'
        replace 'net.minecraft.client.resources.PlayerSkin', 'net.minecraft.world.entity.player.PlayerSkin'
        replace 'net.minecraft.world.entity.animal.Cat', 'net.minecraft.world.entity.animal.feline.Cat'
        replace 'net.minecraft.world.entity.animal.horse.AbstractHorse', 'net.minecraft.world.entity.animal.equine.AbstractHorse'
        replace 'net.minecraft.world.entity.monster.Spider', 'net.minecraft.world.entity.monster.spider.Spider'
        replace 'net.minecraft.world.entity.npc.Villager', 'net.minecraft.world.entity.npc.villager.Villager'
    }

    // MIXIN HEDEF DIZGILERI (@Inject method = "..."). Bunlar >=1.21.9 ile BIRLIKTE
    // gidemiyor, cunku 26.x ikisini de yeniden kirdi. Her biri src/ icinde tek kullanim.
    //
    // 1.21.9 <= x < 26 araligi:
    //   DebugScreenOverlay.getGameInformation -> getLeftText
    //   FogRenderer.setupFog                  -> applyFog
    replacements.string(current.parsed >= '1.21.9' && current.parsed < '26') {
        replace 'getGameInformation', 'getLeftText'
        replace 'setupFog', 'applyFog'
    }

    // 26.x:
    //   FogRenderer.setupFog adi GERI DONDU -- 26.3'te yine 'setupFog'. Yani 1.21.9'daki
    //   applyFog yeniden adlandirmasi 26'da geri alinmis; bu yuzden 26.x'te KURAL YOK
    //   (javap ile dogrulandi: FogData setupFog(Camera,int,DeltaTracker,float,ClientLevel)).
    //   Imza ve donus tipi degisti, o kisim //? if ile cozuldu.
    //
    //   DebugScreenOverlay.getGameInformation / getLeftText 26.x'te IKISI DE YOK. Yerine
    //   private void extractLines(GuiGraphicsExtractor, List<String>, boolean, int) var --
    //   listeyi parametre olarak doldurdugu icin donus degeri yerine liste yerinde
    //   degistiriliyor (imza farki //? if ile).
    replacements.string(current.parsed >= '26') {
        replace 'getGameInformation', 'extractLines'
    }
}
