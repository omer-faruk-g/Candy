// Stonecutter MERKEZ BETİĞİ — her düğüm (versions/<sürüm>) için bir kez çalışır.
// Sürüme bağlı değerler versions/<sürüm>/gradle.properties'ten gelir.
// LOADER SECIMI: tek merkez betik iki loader'i da cevirir. Eklenti kosullu uygulanir
// cunku plugins{} blogu kosul kabul etmez — "apply false" ile classpath'e alinir,
// sonra dugumun loader'ina gore apply edilir.
// Neden tek betik: stonecutter replacements listesi TEK yerde kalmak zorunda. Iki kopya
// olsaydi aralarindaki herhangi bir fark, aktif dugum degistiginde paylasilan src/
// agacini yarim cevrilmis halde birakirdi (bkz. asagidaki UYARI).
plugins {
    id 'java'
    id 'fabric-loom' apply false
    id 'net.fabricmc.fabric-loom' apply false
    id 'net.neoforged.moddev' apply false
}

def mc = stonecutter.current.version
def loader = (findProperty('loader') ?: 'fabric').toString()

// JAVA SURUMU SURUME BAGLI. 26.x hattinin tamami JVM 25 istiyor: Minecraft'in KENDI
// class dosyalari major 69 (Java 25) ve javac 21 onlari okuyamiyor bile
// ("class file has wrong version 69.0, should be 65.0"). 1.21.x 21'de kaliyor, yani
// dagitilan 1.21.x jar'larinin calisma zamani gereksinimi DEGISMIYOR.
def javaSurum = stonecutter.current.parsed >= '26' ? 25 : 21

// MIXIN UYUM SEVIYESI DE AYNI SEBEPTEN SURUME BAGLI. Mixin, kendi uyum seviyesinin
// USTUNDE bir class surumu tasiyan mixin sinifini reddediyor; 26.x dugumu Java 25
// bytecode (major 69) uretiyor. Loader'larin getirdigi Mixin surumleri olculdu:
//   loader 0.16.14 -> sponge-mixin 0.15.5 -> en yuksek JAVA_22  (1.21.7)
//   loader 0.20.1  -> sponge-mixin 0.17.5 -> en yuksek JAVA_25  (1.21.11, 26.3)
// Yani JAVA_25'i her dugume yazmak 1.21.7'yi kirardi. Deger candy.mixins.json'a
// sablonla giriyor (bkz. processResources): JSON'da `//? if` kullanilamaz (//? bir
// yorumdur) ve Stonecutter replacements kaynak agacinda kosup resources'a UGRAMIYOR
// -- ikisi de denendi, ikisi de yanlis yol.
def mixinUyum = "JAVA_${javaSurum}".toString()

// MAPPING YOLU SURUME BAGLI. 26.x'te Mojang obfuscation'i BIRAKTI: version JSON'da
// client_mappings yok ve Fabric intermediary de 1.21.11'de duruyor. Yani 26.x'te
// eslenecek bir sey yok — jar zaten net/minecraft/* adlarini tasiyor.
// Loom bunu ayri bir plugin id ile cozuyor (loom 1.19.3 jar'indan dogrulandi):
//   fabric-loom              -> LoomGradlePlugin        (remap)
//   net.fabricmc.fabric-loom -> LoomNoRemapGradlePlugin  (no-remap)
// No-remap yolunda `mappings` satiri OLMAMALI (okunmuyor) ve remapJar task'i YOK.
def obfuscated = stonecutter.current.parsed < '26'

// REPLACEMENTS IKI YONLU CALISIYOR -- deneyle olculdu, dokumante edilmemis.
// `replacements.string(kosul)` bloğundaki her kural, kosulun DOGRU oldugu dugumde
// ileri, kosulun YANLIS oldugu pasif dugumde GERIYE uygulaniyor. Kanit: `drawString`
// -> `text` kurali eklendiginde 1.21.11'in uretilen agacinda `texture` ->
// `drawStringure` ve `getContext` -> `getCondrawString` olustu; bunu uretebilecek tek
// sey o kuralin tersiydi.
//
// SONUC -- her kuralin SONUC metni, kaynak agacta ya hic bulunmamali ya da yalnizca
// pasif dalin blok yorumu icinde bulunmali. Aksi halde kural, hedeflemedigi bir
// dugumde dogru kodu bozar. Pratikte: kisa/genel metinler (drawString, text, Gui)
// kural olarak YAZILAMAZ, alici ustunden capalanmalari gerekir (ctx.drawString( gibi).
// Aktif dugum (1.21.7) src/ agacini YERINDE derledigi icin orada hic replacement
// kosmaz; bu yuzden ters yon ancak pasif dugumlerde goze carpiyor.

version = "${property('mod_version')}+${mc}"
group = property('maven_group')
base { archivesName = property('archives_base_name') }

// LOADER'A OZEL KAYNAK AGACI. Paylasilan src/main/java (206 dosya) TEK; bunun yaninda
// her loader kendi platform katmanini kendi agacinda tutuyor. Ayni paket + ayni sinif
// adlari, farkli govdeler — cagri yerleri iki tarafta da ayni kodu yaziyor.
// Stonecutter DALI DEGIL: 206 dosya kopyalanmiyor, yalnizca ince katman ikiye ayriliyor.
// Bu agaclarda //? direktifi ve replacement YOK; iki MC surumunde de ayni derlenen
// sembolleri kullanmak zorundalar.
sourceSets.main.java.srcDir rootProject.file("src/${loader}/java")
// DIKKAT: yukaridaki dizin KOK yoldan ekleniyor, yani Stonecutter'in uretilmis agacinda
// DEGIL -> icindeki `//? if` directifleri CALISMAZ ve replacements oraya UGRAMAZ
// (hata mesajlarindaki yol da bunu gosteriyor: src\fabric\java\... vs
// versions/<s>/build/generated/stonecutter/main/java/...). 26.x'te Fabric API'nin
// payload kayit adlari degisti (playS2C/playC2S -> clientboundPlay/serverboundPlay),
// bu yuzden YALNIZCA o farki tasiyan kucuk sinif surume gore ayri bir dizinden geliyor.
if (loader == 'fabric') {
    sourceSets.main.java.srcDir rootProject.file(
        obfuscated ? 'src/fabric-kayit-eski/java' : 'src/fabric-kayit-26/java')
}

// BOYUT TIPI (dimension_type) SEMASI 1.21.9'DA KIRILDI -- data katmaninda, derleyicinin
// gormedigi yerde. Olculdu: her surumun KENDI jar'indaki vanilla dosyalari okunarak
// (data/minecraft/dimension_type/*.json), tahminle degil.
//   1.21.7  : ultrawarm, natural, piglin_safe, bed_works, respawn_anchor_works,
//             has_raids, effects, fixed_time   -> hepsi dogrudan dimension_type alani
//   1.21.11 : BU SEKIZ ANAHTAR YOK. Yerine attributes (EnvironmentAttributeMap),
//             skybox, cardinal_light, has_fixed_time + timelines geldi. monster_spawn_*
//             kaldi (hala ZORUNLU). Bilinmeyen anahtari DFU sessizce atiyor, yani
//             eski dosyalar HATA VERMEDEN yukleniyordu ve sekiz anahtarin tamami
//             GOZARDI EDILIYORDU -- siyah gokyuzu (sky_color default 0x000000),
//             siyah sis, ve gameplay/sky_light_level default 15.0 ile surekli gunduz.
//   26.x    : ayni sema + has_ender_dragon_fight ZORUNLU (fieldOf) oldu.
// Yani tek dosya iki semayi birden karsilayamaz: ayri agac. replacements buraya
// ugramiyor (resources'a girmiyor), processResources/expand ise tek tek deger icin;
// burada butun dosya degisiyor, o yuzden src/fabric-kayit-* ile ayni yol: srcDir secimi.
sourceSets.main.resources.srcDir rootProject.file(
    stonecutter.current.parsed >= '1.21.9' ? 'src/boyut-yeni/resources'
                                           : 'src/boyut-eski/resources')

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.neoforged.net/releases' }
}

if (loader == 'fabric') {
    apply plugin: obfuscated ? 'fabric-loom' : 'net.fabricmc.fabric-loom'

    dependencies {
        minecraft "com.mojang:minecraft:${property('minecraft_version')}"
        if (obfuscated) {
            // Mojang resmî adları. Yarn eşlemeleri 1.21.11'de durduğu için Yarn'da kalmak
            // 26.x hattını kalıcı olarak kapatıyordu; kaynak Mojang adlarına göçtü
            // (bkz. MULTILOADER.md "Mapping göçü"). Yarn artık hiçbir düğümde kullanılmıyor,
            // ama versions/<sürüm>/gradle.properties içindeki yarn_mappings anahtarı
            // doğrulama/karşılaştırma için korundu.
            mappings loom.officialMojangMappings()
        }
        // 26.x'te `mappings` satiri YOK ve olmamali: officialMojangMappings() 26.x icin
        // "Failed to find official mojang mappings" ile patliyor (client_mappings
        // yayinlanmiyor), ve no-remap yolunda loom `mappings` yapilandirmasini hic okumuyor.

        // mod* YAPILANDIRMALARI DA SURUME BAGLI. LoomConfigurations bytecode'unda
        // disableObfuscation() true ise `namedElements`, `mappings`, `mappingsFinal` ve
        // createRemapConfigurations(sourceSet) ATLANIYOR — yani no-remap yolunda
        // modImplementation diye bir yapilandirma YOK ("Could not find method
        // modImplementation()"). Zaten gereksiz: remap edilecek bir ad uzayi yok,
        // mod jar'lari dogrudan derleme yolunda kullanilabilir.
        def modDep = obfuscated ? 'modImplementation' : 'implementation'
        add(modDep, "net.fabricmc:fabric-loader:${property('loader_version')}")
        add(modDep, "net.fabricmc.fabric-api:fabric-api:${property('fabric_version')}")
        // Gson zaten Minecraft ile geliyor, ayrıca eklemiyoruz
    }

    // Test profili: ./gradlew runTest
    // runClient GERCEK davranisi korur (45 sn cooldown, komut kilidi acik, dev komutu yok).
    // runTest ise kapiyi acar: /candy komutu + kisa cooldown + vanilla cheat komutlari.
    // Yalnizca dev run'i etkiler; jar'a hicbir sey sizmaz.
    loom {
        runs {
            test {
                client()
                name = "Candy Test Client"
                vmArg "-Dcandy.debug=true"   // /candy komutu + kisa cooldown
                vmArg "-Dcandy.nolock=true"  // /gamemode /tp /time gibi vanilla komutlar
            }
        }
    }
} else {
    // NeoForge: ModDevGradle. Minecraft'i Mojang resmi adlariyla veriyor — kaynak
    // zaten o adlari tasiyor, remap yok. (Gocten once bu yol kapali idi.)
    apply plugin: 'net.neoforged.moddev'

    // Port suresince TAM hata listesi lazim; javac varsayilan 100'de kesiyor ve
    // kesilmis sayi "ilerleme yok" gibi gorunuyor. Port bitince kaldirilabilir.
    tasks.withType(JavaCompile).configureEach {
        it.options.compilerArgs << '-Xmaxerrs' << '2000'
    }

    neoForge {
        version = property('neoforge_version')
        // Mixin yapilandirmasi neoforge.mods.toml icindeki [[mixins]] ile bildiriliyor;
        // candy.mixins.json oldugu gibi yeniden kullaniliyor.
        validateAccessTransformers = true
        runs {
            client { client() }
            // Test profili Fabric tarafiyla ayni bayraklari tasir.
            testClient {
                client()
                systemProperty 'candy.debug', 'true'
                systemProperty 'candy.nolock', 'true'
            }
        }
        mods {
            candy {
                sourceSet sourceSets.main
            }
        }
    }
}

// Kapanis icinde property() task'a delege olur, projeye degil — disarida yakala.
def modSurum = version
def mcDep = property('minecraft_dep')
// fabric.mod.json'daki "java" kisiti da surume bagli: 26.x jar'i JVM 25 istiyor.
// Sabit ">=21" birakilsa 26.x jar'i Java 21'de yuklenmeyi kabul eder ve oyun
// ic cagrida patlardi.
def javaDep = ">=${javaSurum}".toString()
// LOADER ALT SINIRI DA SURUME BAGLI. 26.x JAVA_25 uyum seviyesiyle derleniyor ve o
// seviyeyi tanıyan ilk Mixin loader 0.20.1 ile geliyor; daha eski bir loader'da jar
// yuklenir ama mixin'lerin HEPSI sessizce reddedilirdi. Alt sinir dugumun kendi
// loader_version'u: tek yerde duruyor, elle ikinci bir yere yazilmiyor.
def loaderDep = ">=${property('loader_version')}".toString()
processResources {
    inputs.property "version", modSurum
    inputs.property "minecraft_dep", mcDep
    inputs.property "java_dep", javaDep
    inputs.property "mixin_uyum", mixinUyum
    inputs.property "loader_dep", loaderDep
    // Iki loader'in metadata dosyasi da ayni degerleri bekliyor. loader_dep yalnizca
    // fabric.mod.json'da geciyor; neoforge.mods.toml'da karsiligi yok, expand fazla
    // anahtarlari gormezden geliyor.
    filesMatching(["fabric.mod.json", "META-INF/neoforge.mods.toml"]) {
        expand "version": modSurum, "minecraft_dep": mcDep, "java_dep": javaDep,
               "loader_dep": loaderDep
    }
    filesMatching("candy.mixins.json") {
        expand "mixin_uyum": mixinUyum
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaSurum
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(javaSurum)
    targetCompatibility = JavaVersion.toVersion(javaSurum)
}

jar {
    from("LICENSE") { rename { "${it}_${base.archivesName.get()}" } }
}

// Her düğümün jar'ı kök build/libs altında toplanır — dağıtımı tek yerden yapmak için.
// Remap OLAN yerde dagitilan jar remapJar'in ciktisi. Remap olmayan iki durumda jar
// dogrudan: NeoForge (hep) ve Fabric 26.x (no-remap yolunda remapJar task'i YOK).
def remapVar = loader == 'fabric' && obfuscated
def dagitimJar = remapVar ? tasks.named('remapJar') : tasks.named('jar')
tasks.register('tumunuTopla', Copy) {
    dependsOn dagitimJar
    from dagitimJar
    into rootProject.layout.buildDirectory.dir('libs')
}

// Dogrulama yardimcisi: derlenmis siniflari headless kosturmak icin classpath yaz.
tasks.register('yazCp') {
    doLast {
        def f = layout.buildDirectory.file('cp.txt').get().asFile
        f.parentFile.mkdirs()
        f.text = sourceSets.main.runtimeClasspath.asPath
        println "cp -> ${f}"
    }
}

// Surumler arasi mapping yeniden adlandirmalari.
// UYARI: Stonecutter bu degisimleri PAYLASILAN src/ agacina YERINDE uygular. Aktif surum
// degistiginde src/ o surumun adlarina donusur. Bu yuzden bir kural eklendikten sonra
// SILINMEMELI: silinen kuralin tersi calismaz ve src/ yarim cevrilmis halde kalir.
// Adlar javap ile 1.21.7 ve 1.21.11 yarn jar'larindan dogrulandi.
//
// KURAL SECIMI: duz metin degisimi alici tipini bilmez. Ad iki tarafta da gecerliyse
// (Chunk.getPos ile Entity.getPos gibi) ciplak desen yanlis siniflari da vurur.
// Yonu ters cevirmek cozum DEGIL: aktif dugum src/'yi yerinde derler, replacement
// orada hic kosmaz — yani src/ her zaman AKTIF surumun adlarini tasimak zorunda.
// Dolayisiyla belirsiz adlar aliciya capalanir ("player.getPos()"), ciplak birakilmaz.
// Yeni bir entity degiskeni eklenirse buraya kurali da eklemek gerekir; eksikse
// 1.21.11 derlemesi o satirda yuksek sesle patlar, sessiz kalmaz.
// Kurallar Mojang adlarina gore yeniden yazildi. Yarn'daki iki kural BURADA YOK ve
// olmamasi dogru: Entity.getWorld/getPos ikilisi Yarn'da 1.21.9'da yeniden adlandirilmisti,
// Mojang ise iki surumde de level()/position() diyor — yani o iki kural Yarn'in kendi
// yeniden adlandirmasiydi, Minecraft'in degil. Mojang tarafi onlari ucuruyor.
//
// Karsiliginda Mojang'in Yarn'in sakladigi yeniden adlandirmalari var: ResourceLocation
// -> Identifier (70 kullanim) ve PlayerRenderState -> AvatarRenderState. Yarn iki surumde
// de Identifier/PlayerEntityRenderState dedigi icin bunlar eski kural listesinde yoktu.
//
// Liste tahminle degil, OLCUMLE cikarildi: iki dugumun Mercury ile gocurulmus agaclari
// (migrateMappings, 1.21.7 ve 1.21.11) birebir karsilastirildi; asagidakiler iki agac
// arasinda farklilasan butun sembollerdir.
stonecutter {
    // Loader sabitleri: kaynakta `//? if fabric {` / `//? if neoforge {` kullanilabilir.
    // Dal (branch) DEGIL — paylasilan src/ agaci tek, yalnizca satirlar aciliyor/kapaniyor.
    constants.match(loader, 'fabric', 'neoforge')

    replacements.string(current.parsed >= '1.21.9') {
        // Sinif yeniden adlandirmalari. Candy'de ayni adi tasiyan kendi sinifi yok,
        // mixin method= dizgilerinde de gecmiyorlar (dogrulandi), o yuzden ciplak.
        replace 'ResourceLocation', 'Identifier'
        replace 'PlayerRenderState', 'AvatarRenderState'
        // ResourceKey.location() -> identifier(). 'location' cok yaygin bir ad, bu yuzden
        // ciplak DEGIL; uc gercek alicinin hepsi capalandi.
        replace '.dimension().location()', '.dimension().identifier()'
        replace 'key.location()', 'key.identifier()'
        replace 'worldKey.location()', 'worldKey.identifier()'
        // authlib 7: GameProfile record oldu. getGameProfile() ile capalandi ki ayni adi
        // tasiyan baska siniflar (Entity.getName gibi) etkilenmesin.
        replace '.getGameProfile().getName()', '.getGameProfile().name()'
        replace '.getGameProfile().getProperties()', '.getGameProfile().properties()'
        // Paket tasimalari. Hepsi tam nitelikli, her biri src/ icinde tek kullanim.
        replace 'net.minecraft.client.model.PlayerModel', 'net.minecraft.client.model.player.PlayerModel'
        replace 'net.minecraft.client.resources.PlayerSkin', 'net.minecraft.world.entity.player.PlayerSkin'
        replace 'net.minecraft.world.entity.animal.Cat', 'net.minecraft.world.entity.animal.feline.Cat'
        replace 'net.minecraft.world.entity.animal.horse.AbstractHorse', 'net.minecraft.world.entity.animal.equine.AbstractHorse'
        replace 'net.minecraft.world.entity.monster.Spider', 'net.minecraft.world.entity.monster.spider.Spider'
        replace 'net.minecraft.world.entity.npc.Villager', 'net.minecraft.world.entity.npc.villager.Villager'
    }

    // MIXIN HEDEF DIZGILERI (@Inject method = "..."). Bunlar >=1.21.9 ile BIRLIKTE
    // gidemiyor, cunku 26.x ikisini de yeniden kirdi. Her biri src/ icinde tek kullanim.
    //
    // 1.21.9 <= x < 26 araligi:
    //   DebugScreenOverlay.getGameInformation -> getLeftText
    //   FogRenderer.setupFog                  -> applyFog
    replacements.string(current.parsed >= '1.21.9' && current.parsed < '26') {
        replace 'getGameInformation', 'getLeftText'
        replace 'setupFog', 'applyFog'
    }

    // 26.x:
    //   FogRenderer.setupFog adi GERI DONDU -- 26.3'te yine 'setupFog'. Yani 1.21.9'daki
    //   applyFog yeniden adlandirmasi 26'da geri alinmis; bu yuzden 26.x'te KURAL YOK
    //   (javap ile dogrulandi: FogData setupFog(Camera,int,DeltaTracker,float,ClientLevel)).
    //   Imza ve donus tipi degisti, o kisim //? if ile cozuldu.
    //
    //   DebugScreenOverlay.getGameInformation / getLeftText 26.x'te IKISI DE YOK. Yerine
    //   private void extractLines(GuiGraphicsExtractor, List<String>, boolean, int) var --
    //   listeyi parametre olarak doldurdugu icin donus degeri yerine liste yerinde
    //   degistiriliyor (imza farki //? if ile).
    replacements.string(current.parsed >= '26') {
        // NOT: getGameInformation icin 26.x ad kurali YOK. 26.x'te metot yalnizca yeniden
        // adlandirilmadi; satirlari ureten metot kalmadi (DebugScreenEntry'ler uretiyor) ve
        // extractLines yalnizca cizim yapiyor. Bu yuzden DebugHudMixin'de govde bastan
        // //? if ile ayrildi ve 26.x dali gercek adi/imzasini tasiyor.

        // --- 26.x ad degisiklikleri. HEPSI javap ile olculdu (26.2 ve 26.3 slice'lari). ---

        // Entity.getTags() -> entityTags(). 26.2'de DE boyle (olculdu), o yuzden >=26.
        replace 'getTags()', 'entityTags()'


        // ChunkPos artik bir record: x/z alanlari private, statik asLong -> pack.
        // BlockPos.asLong() (parametresiz) DEGISMEDI, o yuzden kural ChunkPos'a capalandi.
        replace 'ChunkPos.asLong(', 'ChunkPos.pack('
        replace 'chunkPosition().x', 'chunkPosition().x()'
        replace 'chunkPosition().z', 'chunkPosition().z()'

        // Level zaman API'si WorldClock'a tasindi: getDayTime() -> getDefaultClockTime()
        // (seviyenin kendi saati; overworld icin ayni degeri verir).
        replace 'getDayTime()', 'getDefaultClockTime()'

        // Player.displayClientMessage(Component, boolean actionBar) IKIYE AYRILDI:
        //   sendSystemMessage(Component)  (sohbet)
        //   sendOverlayMessage(Component) (hotbar ustu)
        // Candy'nin 44 cagri yerinin HEPSI actionBar=false, yani sohbet. ServerPlayer'da
        // iki parametreli sendSystemMessage(Component, boolean) DURUYOR ve bytecode'u
        // 1.21.x'teki displayClientMessage yolunun aynisi:
        // acceptsSystemMessages(flag) -> ClientboundSystemChatPacket(component, flag).
        // Yani ServerPlayer alicilarinda bu duz bir ad degisikligi; davranis ayni.
        // TEK istisna LocalPlayer (CandyClient): orada iki parametreli asiri yukleme yok,
        // o cagri //? if ile ayrildi.
        replace 'displayClientMessage(', 'sendSystemMessage('

        // GuiGraphics -> GuiGraphicsExtractor ile birlikte metin cizme adi da degisti:
        //   drawString(Font, X, int, int, int, boolean) -> text(Font, X, int, int, int, boolean)
        // Imza ayni; yalnizca InGameHudMixin kullaniyor (8 yer, hepsi `ctx` alicisi).
        //
        // ALICIYA CAPALI OLMAK ZORUNDA (bkz. yukarıdaki IKI YONLU notu): ciplak
        // `drawString` -> `text` kurali, ters yonde 1.21.11'de `text` -> `drawString`
        // olarak kosup `texture` ve `getContext` gibi ALAKASIZ adlari bozuyordu
        // (net.minecraft.client.renderer.drawStringure, parseResults.getCondrawString()).
        // `ctx.text(` metni kaynakta hic gecmedigi icin bu kuralin tersi artik no-op.
        replace 'ctx.drawString(', 'ctx.text('

        // Fabric API entity-events 6.x: ServerEntityWorldChangeEvents yeniden adlandirildi
        // (olculdu: jar icinde ServerEntityLevelChangeEvents, AFTER_PLAYER_CHANGE_LEVEL).
        replace 'ServerEntityWorldChangeEvents', 'ServerEntityLevelChangeEvents'
        replace 'AFTER_PLAYER_CHANGE_WORLD', 'AFTER_PLAYER_CHANGE_LEVEL'

        // NOT: ServerBossEvent ctor'una UUID eklendi, ama o kural BURAYA yazilamaz --
        // 'new ServerBossEvent(' aradigi metin uretilen metnin de PARCASI olurdu ve
        // degistirmenin tek gecisli oldugu VARSAYIMINA dayanirdi. Tek cagri yeri oldugu
        // icin TrueRealCandyEntity icinde //? if ile ayrildi.

        // Istemci paket tasimalari / yeniden adlandirmalari.
        // SADECE ciplak kural: tam nitelikli adi da o kapsiyor. FQN kurali ayri yazilsa
        // 'GuiGraphics' -> 'GuiGraphicsExtractor' ikinci kez calisip
        // 'GuiGraphicsExtractorExtractor' uretirdi (metin degistirme onek bilmiyor).
        //
        // LightTexture SINIF OLARAK Lightmap'e donustu AMA karartma hesabi orada DEGIL:
        // 26.x'te Lightmap yalnizca GPU dokusunu tutuyor (render(LightmapRenderState)),
        // calculateDarknessScale(LivingEntity, float, float) ise AYNI AD VE AYNI IMZAYLA
        // net.minecraft.client.renderer.LightmapRenderStateExtractor'a tasindi. Mixin'in
        // hedefi o sinif, bu yuzden kural Lightmap'e degil oraya gidiyor (LightTexture
        // adi src icinde yalnizca LightmapTextureManagerMixin'de, 2 yerde geciyor).
        replace 'LightTexture', 'LightmapRenderStateExtractor'
        replace 'GuiGraphics', 'GuiGraphicsExtractor'
        replace 'net.minecraft.client.renderer.state.CameraRenderState',
                'net.minecraft.client.renderer.state.level.CameraRenderState'
    }

    // 26.1 bytecode'u da olculdu: asagidaki iki grup 26.1'de HALA 1.21.x seklinde
    // (EntityType sabitleri sinifin kendisinde, bedler renk renk ayri blok), degisim
    // 26.2'de oldu. >=26'da birakilmis olsa 26.1 dugumu 19 hatayla kirmizi kalirdi.
    replacements.string(current.parsed >= '26.2') {
        // EntityType sabitleri yeni bir tutucuya tasindi: EntityTypes. 26.1'de hala
        // net.minecraft.world.entity.EntityType icinde (olculdu: 174 sabit).
        // Tam nitelikli yaziliyor ki import eklemek gerekmesin.
        replace 'EntityType.CAVE_SPIDER', 'net.minecraft.world.entity.EntityTypes.CAVE_SPIDER'
        replace 'EntityType.CHICKEN', 'net.minecraft.world.entity.EntityTypes.CHICKEN'
        replace 'EntityType.COW', 'net.minecraft.world.entity.EntityTypes.COW'
        replace 'EntityType.CREEPER', 'net.minecraft.world.entity.EntityTypes.CREEPER'
        replace 'EntityType.PIG', 'net.minecraft.world.entity.EntityTypes.PIG'
        replace 'EntityType.SHEEP', 'net.minecraft.world.entity.EntityTypes.SHEEP'
        replace 'EntityType.SKELETON', 'net.minecraft.world.entity.EntityTypes.SKELETON'
        replace 'EntityType.SPIDER', 'net.minecraft.world.entity.EntityTypes.SPIDER'
        replace 'EntityType.VILLAGER', 'net.minecraft.world.entity.EntityTypes.VILLAGER'
        replace 'EntityType.ZOMBIE', 'net.minecraft.world.entity.EntityTypes.ZOMBIE'

        // Renkli bloklar ColorCollection'a toplandi: Blocks.BLUE_BED -> Blocks.BED.pick(BLUE).
        // 26.1'de hala WHITE_BED/ORANGE_BED/... diye ayri sabitler var (olculdu).
        replace 'Blocks.BLUE_BED', 'Blocks.BED.pick(net.minecraft.world.item.DyeColor.BLUE)'
    }

    // 26.x TEK BIR API DEGIL. 26.2 bytecode'u javap ile olculdu: asagidaki dort grup
    // 26.2'de HALA 1.21.x seklinde, degisim 26.3'te oldu. Esik bu yuzden >=26 degil
    // >=26.3 -- hepsi >=26'da birakilmis olsa 26.2 dugumu 20 hatayla kirmizi kalirdi
    // (olculdu). SignText'in degismez hali de ayni esikte, o TabelaUyum icinde.
    replacements.string(current.parsed >= '26.3') {
        // Dokunulmazlik kalici/gecici diye ikiye ayrildi; Candy'nin istedigi kalici.
        // 26.2'de hala tek bir setInvulnerable(boolean) var.
        replace 'setInvulnerable(', 'setPermanentlyInvulnerable('

        // Loot sayi saglayicilari ints/floats olarak ayrildi, ConstantValue record oldu
        // ve LootPool.Builder.setRolls artik Holder<ContextIntProvider> aliyor. 26.2'de
        // hala ...providers.number.ConstantValue + exactly(float) ve
        // setRolls(NumberProvider) duruyor (olculdu).
        replace 'net.minecraft.world.level.storage.loot.providers.number.ConstantValue',
                'net.minecraft.world.level.storage.loot.providers.number.ints.ConstantValue'
        replace 'ConstantValue.exactly(1)',
                'net.minecraft.core.Holder.direct(new ConstantValue(1))'

        // LivingEntity.swing(InteractionHand) -> swing(InteractionHand, SwingAnimation,
        // boolean). SwingAnimation.DEFAULT + false, 1.21.x'teki swing(hand) ==
        // swing(hand, false) davranisini birebir verir. 26.2'de iki parametreli
        // swing(hand, boolean) duruyor, uc parametreli yok (olculdu).
        replace 'swing(net.minecraft.world.InteractionHand.MAIN_HAND)',
                'swing(net.minecraft.world.InteractionHand.MAIN_HAND, net.minecraft.world.item.component.SwingAnimation.DEFAULT, false)'

        // Envantere geri koyma / dusurme artik bir Prediction aliyor; her iki cagri da
        // sunucu tarafinda, yani SERVER_ONLY. net.minecraft.util.Prediction sinifi
        // 26.2'de HENUZ YOK (olculdu), drop(ItemStack, boolean) duruyor.
        replace 'player.drop(kitap, false)',
                'player.drop(kitap, false, net.minecraft.util.Prediction.SERVER_ONLY)'
        replace 'Denek239Book.olusturTam(true));',
                'Denek239Book.olusturTam(true), net.minecraft.util.Prediction.SERVER_ONLY);'
    }
}
